<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #111111;
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      color: #e2e2e2;
      overflow: hidden;
      user-select: none;
      /* allow dragging the frameless window */
      -webkit-app-region: drag;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 18px;
    }

    /* ── Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .diamond {
      font-size: 36px;
      color: #4fc3f7;
      animation: pulse 2s ease-in-out infinite;
    }
    .name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Progress bar ── */
    .bar-wrap {
      width: 220px;
      height: 2px;
      background: #222;
      border-radius: 1px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #81c784);
      border-radius: 1px;
      animation: load 1.8s ease-in-out infinite;
      transform-origin: left;
    }

    /* ── Version ── */
    .version {
      font-size: 11px;
      color: #444;
    }

    /* ── Animations ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    @keyframes load {
      0%   { transform: scaleX(0);   margin-left: 0;    }
      50%  { transform: scaleX(0.7); margin-left: 0;    }
      100% { transform: scaleX(0);   margin-left: 220px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="brand">
      <span class="diamond">◆</span>
      <span class="name">openclaude</span>
    </div>
    <div class="subtitle">chat · loading</div>
    <div class="bar-wrap">
      <div class="bar"></div>
    </div>
    <div class="version" id="ver">v0.6.0</div>
  </div>
</body>
</html>
